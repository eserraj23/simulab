function bomRows(){const m={};P.racks.forEach(r=>r.items.forEach(it=>{const k=it.li+"|"+it.price+"|"+mm(it).join("|");m[k]=m[k]||{li:it.li,price:it.price,q:0,desc:it.desc||0,mm:mm(it)};m[k].q+=it.qty}));return Object.values(m)}
function bom(){const rows=bomRows();let mat=0,h=`<table><tr><th>Ref</th><th>Fabricante</th><th>Modelo</th><th>Cant.</th><th>P.unit €</th><th>Dto %</th><th>Total €</th></tr>`;
rows.forEach((x,i)=>{const d=lib()[x.li],t=x.q*x.price*(1-x.desc/100);mat+=t;h+=`<tr><td>${esc(x.mm[2])}</td><td>${esc(x.mm[0])}</td><td>${esc(x.mm[1])}</td><td>${x.q}</td><td>${x.price}</td><td><input type="number" value="${(P.dto||{})[x.li]||0}" onchange="(P.dto=P.dto||{})[${x.li}]=+this.value;commit()"></td><td>${t.toFixed(2)}</td></tr>`});
mat=rows.reduce((a,x)=>a+x.q*x.price*(1-((P.dto||{})[x.li]||0)/100),0);const e=P.extra,ex=Object.values(e).reduce((a,b)=>a+b,0),sub=(mat+ex)*(1+P.margin/100),iva=sub*P.vat/100;
h+=`</table><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">`+[["mano","Mano obra"],["inst","Instalación"],["cab","Cableado"],["acc","Accesorios"],["trans","Transporte"],["otros","Otros"]].map(([k,l])=>`<label>${l} € <input type="number" style="width:70px" value="${e[k]}" onchange="P.extra.${k}=+this.value;commit()"></label>`).join("")+`<label>Margen % <input type="number" style="width:55px" value="${P.margin}" onchange="P.margin=+this.value;commit()"></label><label>IVA % <input type="number" style="width:55px" value="${P.vat}" onchange="P.vat=+this.value;commit()"></label></div><p>Materiales ${mat.toFixed(2)} € · Extras ${ex.toFixed(2)} € · Subtotal (con margen) <b>${sub.toFixed(2)} €</b> · IVA ${iva.toFixed(2)} € · <b>TOTAL ${(sub+iva).toFixed(2)} €</b></p>`;$("bom").innerHTML=h}
function all(){const r=R();$("ps").innerHTML=D.ps.map((p,i)=>`<option value="${i}" ${i==D.act?"selected":""}>${esc(p.name)} — ${esc(p.client)}</option>`).join("");
$("rs").innerHTML=P.racks.map((x,i)=>`<option value="${i}" ${x==r?"selected":""}>${esc(x.name)}</option>`).join("");$("hu").value=r.u;$("dep").value=r.depth;$("ty").value=r.type;$("vw").textContent=V.rear?"Posterior":"Frontal";$("meta").textContent=`Cliente: ${P.client} · Versiones: ${(P.vs||[]).length}`;draw();pp();sts();bom();libr()}
$("ps").onchange=e=>{D.act=+e.target.value;P=D.ps[D.act];V.ri=0;H=[];snap();save();all()};
$("rs").onchange=e=>{V.ri=+e.target.value;V.sel=null;all()};
[12,15,18,22,27,32,36,42,45,47].concat([6,9]).sort((a,b)=>a-b).forEach(u=>$("hu").add(new Option(u+"U",u)));
$("hu").onchange=e=>{const r=R(),n=+e.target.value;if(r.items.some(i=>i.u+lib()[i.li][5]-1>n)){toast("⚠ Hay equipos fuera de esa altura");return all()}r.u=n;commit()};
$("dep").onchange=e=>{R().depth=+e.target.value;commit()};$("ty").onchange=e=>{R().type=e.target.value;commit()};$("q").oninput=libr;
function addRack(){P.racks.push({id:Date.now(),name:prompt("Identificador del rack","Rack "+(P.racks.length+1))||"Rack",u:42,depth:1000,type:"suelo",items:[]});V.ri=P.racks.length-1;commit()}
function delRack(){if(P.racks.length<2)return toast("Debe quedar al menos un rack");if(confirm("¿Eliminar este rack?")){P.racks.splice(V.ri,1);V.ri=0;commit()}}
function np(){const n=prompt("Nombre del proyecto");if(!n)return;const c=prompt("Cliente","");const p=seed();p.name=n;p.client=c||"";p.racks[0].items=[];D.ps.push(p);D.act=D.ps.length-1;P=p;V.ri=0;H=[];commit();toast("Proyecto creado")}
function dp(){const p=JSON.parse(JSON.stringify(P));p.name+=" (copia)";p.id=Date.now();D.ps.push(p);D.act=D.ps.length-1;P=p;commit();toast("Proyecto duplicado")}
function rp(){const n=prompt("Nuevo nombre",P.name);if(n){P.rev.push({t:new Date().toLocaleString(),n:"Renombrado de "+P.name});P.name=n;commit()}}
function xp(){if(D.ps.length<2)return toast("Debe existir al menos un proyecto");if(confirm("¿Eliminar el proyecto «"+P.name+"»?")){D.ps.splice(D.act,1);D.act=0;P=D.ps[0];V.ri=0;commit()}}
function cust(){const n=prompt("Nombre");if(!n)return;const u=+prompt("Altura en U (1-4)","1")||1,pr=+prompt("Precio €","100")||0,w=+prompt("Consumo W","0")||0;LIBX.push(["Personalizados",n,"Propio",n,"CUST-"+LIBX.length,u,500,5,w,pr,"sv",0]);ls.rd_lib=JSON.stringify(LIBX);libr();toast("Componente guardado")}
function dl(n,b){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click()}
function ex(t){const nm=P.name.replace(/\W+/g,"_");if(t=="json")return dl(nm+".json",new Blob([JSON.stringify({p:P,lib:LIBX})],{type:"application/json"}));
if(t=="csv"){const rows=bomRows().map(x=>{const d=lib()[x.li];return[x.mm[2],x.mm[0],x.mm[1],d[1],x.q,x.price,x.q*x.price].join(";")});return dl(nm+".csv",new Blob(["\ufeffRef;Fabricante;Modelo;Descripción;Cant;Precio;Total\n"+rows.join("\n")],{type:"text/csv"}))}
const sv=$("rsv"),x=new XMLSerializer().serializeToString(sv);if(t=="svg")return dl(nm+".svg",new Blob([x],{type:"image/svg+xml"}));
const im=new Image(),vb=sv.viewBox.baseVal,k=2;im.onload=()=>{const c=document.createElement("canvas");c.width=vb.width*k;c.height=vb.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>dl(nm+".png",b))};im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x)}
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);o.p.id=Date.now();D.ps.push(o.p);D.act=D.ps.length-1;P=o.p;V.ri=0;commit();toast("Proyecto importado")}catch(x){toast("⚠ JSON no válido")}})};
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"light":"dark"}
const f2=n=>n.toFixed(2)+" €",now=()=>new Date().toLocaleString("es-ES");
function snapData(){return JSON.stringify({racks:P.racks,vat:P.vat,margin:P.margin,extra:P.extra,dto:P.dto||{},obs:P.obs||""})}
function ver(){const n=prompt("Nota de la versión (qué cambia)","");if(n===null)return;P.vs=P.vs||[];P.vs.push({n:P.vs.length+1,t:now(),note:n,data:snapData()});P.rev.push({t:now(),n:"Versión "+P.vs.length+(n?": "+n:"")});commit();toast("Versión "+P.vs.length+" guardada")}
function rv(i){const v=P.vs[i];if(!confirm("¿Restaurar la versión "+v.n+"? Antes se guardará una copia del estado actual."))return;P.vs.push({n:P.vs.length+1,t:now(),note:"Copia automática antes de restaurar v"+v.n,data:snapData()});Object.assign(P,JSON.parse(v.data));P.rev.push({t:now(),n:"Restaurada versión "+v.n});V.ri=0;V.sel=null;if($("hm"))$("hm").remove();commit();toast("Versión "+v.n+" restaurada")}
function hist(){const m=document.createElement("div");m.id="hm";m.style.cssText="position:fixed;inset:0;background:#0008;z-index:9;display:flex;align-items:center;justify-content:center";m.onclick=e=>{if(e.target==m)m.remove()};const vs=(P.vs||[]).map((v,i)=>{const o=JSON.parse(v.data),n=o.racks.reduce((a,r)=>a+r.items.length,0);return`<tr><td>v${v.n}</td><td>${esc(v.t)}</td><td>${esc(v.note)}</td><td>${o.racks.length} racks · ${n} equipos</td><td><button onclick="rv(${i})">Restaurar</button></td></tr>`}).join("");m.innerHTML=`<div style="background:var(--pn);padding:16px;border-radius:10px;max-width:700px;width:92%;max-height:80vh;overflow:auto"><b>Versiones</b> <button onclick="ver();hist();$('hm').remove()">+ Nueva versión</button><table>${vs||"<tr><td>Sin versiones guardadas</td></tr>"}</table><h3>Historial de modificaciones</h3>${P.rev.slice().reverse().map(r=>`<div><small>${esc(r.t)}</small> ${esc(r.n)}</div>`).join("")||"<small>Sin registros</small>"}<p><button onclick="$('hm').remove()">Cerrar</button></p></div>`;document.body.appendChild(m)}
function obs(){const t=prompt("Observaciones técnicas para el PDF",P.obs||"");if(t!==null){P.obs=t;commit()}}
$("lg").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{D.logo=r.result;save();toast("Logo guardado")};r.readAsDataURL(f)};
function bud(){const dto=P.dto||{};let mat=0;const L2=bomRows().map(x=>{const d=lib()[x.li],dc=dto[x.li]||0,t=x.q*x.price*(1-dc/100);mat+=t;return{d,x,dc,t}}),e=P.extra,ex=Object.values(e).reduce((a,b)=>a+b,0),sub=(mat+ex)*(1+P.margin/100),iva=sub*P.vat/100;return{L2,mat,ex,sub,iva,tot:sub+iva}}
function svgOf(ri,rear){const o=[V.ri,V.rear,V.sel,V.z];V.ri=ri;V.rear=rear;V.sel=null;V.z=1;draw();const s=$("sv").innerHTML.replace(/width="[\d.]+" height="[\d.]+"/,'style="height:190mm;width:auto;max-width:100%"');[V.ri,V.rear,V.sel,V.z]=o;draw();return s}
function pdf(){const b=bud(),v=(P.vs||[]).length,logo=D.logo?`<img src="${D.logo}" style="max-height:60px">`:`<b style="font-size:22px;letter-spacing:1px">RACK DESIGNER PRO</b>`,ri0=V.ri,warns=[];
let h=`<div class="pg" style="min-height:250mm;padding:20mm 8mm;display:flex;flex-direction:column;justify-content:space-between"><div>${logo}</div><div><div style="font-size:12px;color:#1f7ae0;letter-spacing:2px">DOCUMENTACIÓN TÉCNICA Y PRESUPUESTO</div><h1 style="font-size:34px;margin:8px 0">${esc(P.name)}</h1><div style="font-size:18px">Cliente: ${esc(P.client||"—")}</div><div style="margin-top:6px">Fecha: ${new Date().toLocaleDateString("es-ES")} · Versión: ${v?"v"+v:"sin versionar"} · Racks: ${P.racks.length}</div></div><div style="font-size:12px;color:#555">Total del presupuesto: <b>${f2(b.tot)}</b> (IVA incluido)</div></div>`;
P.racks.forEach((r,i)=>{V.ri=i;const s=stats();s.warns.forEach(w=>warns.push(r.name+": "+w));h+=`<div class="pg"><h2>${esc(r.name)} — ${r.u}U · ${r.depth} mm · ${r.type}</h2><div style="display:flex;gap:6mm"><div style="flex:1;text-align:center">Frontal<br>${svgOf(i,0)}</div><div style="flex:1;text-align:center">Posterior<br>${svgOf(i,1)}</div></div></div>`;
h+=`<div class="pg"><h2>Distribución de U e inventario — ${esc(r.name)}</h2><p>Ocupación: ${s.used}/${r.u} U (${s.pct}%) · Peso ${s.wt} kg · Consumo ${s.pw} W</p><table><tr><th>U</th><th>Equipo</th><th>Etiqueta</th><th>Fabricante / Modelo</th><th>Ref.</th><th>kg</th><th>W</th><th>Notas</th></tr>`+[...r.items].sort((a,b)=>b.u-a.u).map(it=>{const d=lib()[it.li];return`<tr><td>${it.u}${d[5]>1?"–"+(it.u+d[5]-1):""}</td><td>${esc(d[1])}</td><td>${esc(it.label)}</td><td>${esc(mm(it).slice(0,2).join(" "))}</td><td>${esc(mm(it)[2])}</td><td>${d[7]*it.qty}</td><td>${d[8]*it.qty}</td><td>${esc(it.note)}</td></tr>`}).join("")+`</table></div>`});V.ri=ri0;
const e=P.extra,cr=(l,x)=>`<tr><td colspan="7">${l}</td><td style="text-align:right">${f2(x)}</td></tr>`;
h+=`<div class="pg"><h2>Relación de materiales y presupuesto</h2><table><tr><th>Ref.</th><th>Fabricante</th><th>Modelo</th><th>Descripción</th><th>Cant.</th><th>P. unit.</th><th>Dto.</th><th>Importe</th></tr>`+b.L2.map(({d,x,dc,t})=>`<tr><td>${esc(x.mm[2])}</td><td>${esc(x.mm[0])}</td><td>${esc(x.mm[1])}</td><td>${esc(d[1])}</td><td>${x.q}</td><td>${f2(x.price)}</td><td>${dc}%</td><td style="text-align:right">${f2(t)}</td></tr>`).join("")+cr("<b>Materiales</b>",b.mat)+cr("Mano de obra",e.mano)+cr("Instalación",e.inst)+cr("Cableado",e.cab)+cr("Accesorios",e.acc)+cr("Transporte",e.trans)+cr("Otros conceptos",e.otros)+cr("Margen comercial ("+P.margin+" %)",(b.mat+b.ex)*P.margin/100)+cr("<b>Subtotal</b>",b.sub)+cr("IVA ("+P.vat+" %)",b.iva)+cr("<b>TOTAL</b>",b.tot)+`</table><h2 style="margin-top:10mm">Observaciones técnicas</h2><p style="white-space:pre-wrap">${esc(P.obs||"Sin observaciones.")}</p>${warns.length?"<p><b>Avisos del diseño:</b></p><ul>"+warns.map(w=>"<li>"+esc(w)+"</li>").join("")+"</ul>":""}</div>`;
$("pdoc").innerHTML=h;print()}
const mm=it=>{const d=lib()[it.li];return[it.mk??d[2],it.md??d[3],it.rf??d[4]]};
const G=(it,k,l,def)=>`<div class="fld"><label>${l}</label><input value="${esc(it[k]??def)}" onchange="setp('${k}',this.value)"></div>`;
function editLib(i){const d=lib()[i],mk=prompt("Fabricante (afecta a toda la biblioteca)",d[2]);if(mk===null)return;const md=prompt("Modelo",d[3]);if(md===null)return;const rf=prompt("Referencia comercial",d[4]);if(rf===null)return;LOV[i]={2:mk,3:md,4:rf};ls.rd_lov=JSON.stringify(LOV);all();toast("Componente de biblioteca actualizado")}
snap();all();setInterval(save,5000);
</script></body></html>
