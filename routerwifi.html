<script>
'use strict';
/* ===== Utilidades IPv4 ===== */
const ip2n=s=>s.split('.').reduce((a,b)=>a*256+ +b,0);
const n2ip=n=>[24,16,8,0].map(k=>Math.floor(n/2**k)%256).join('.');
const vIP=s=>/^(\d{1,3})(\.\d{1,3}){3}$/.test(s)&&s.split('.').every(x=>+x<=255);

const vPort=p=>Number.isInteger(+p)&&+p>=1&&+p<=65535;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== Estado ===== */

 .map((d,i)=>({n:d[0],t:d[1],link:d[2],bands:d[3]==2?['2.4']:d[3]==5?['2.4','5']:d[3]==3?['2.4','5','6']:['2.4'],mac:'02:1A:2B:3C:4D:'+(16+i).toString(16).toUpperCase(),sip:'',blocked:false,prio:d[4],lim:0})),

log:[]});
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;s='wrl|'+s;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
let S;

/* ===== Motor de simulación ===== */
const MODES={ '2.4':['b','g','n','ax','be'],'5':['n','ac','ax','be'],'6':['ax','be']};
const MN={b:'802.11b',g:'802.11g',n:'802.11n (Wi-Fi 4)',ac:'802.11ac (Wi-Fi 5)',ax:'802.11ax (Wi-Fi 6/6E)',be:'802.11be (Wi-Fi 7)'};
const CH={'2.4':cc=>cc=='US'?rng(1,11):rng(1,13),'5':()=>[36,40,44,48,52,56,60,64,100,104,108,112,116,120,124,128,132,136,140],'6':()=>rng(1,229).filter(x=>x%4==1&&x<=93)};
function rng(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r}
const BW={'2.4':[20,40],'5':[20,40,80,160],'6':[20,40,80,160,320]};
const C6=['ES','US','DE','FR'];
function bwOk(w,band,mode){if(band=='2.4')return w==20||(w==40&&mode!='b'&&mode!='g');if(w>=80&&!['ac','ax','be'].includes(mode))return false;if(w==320)return mode=='be'&&band=='6';return w!=160||mode!='ac'||true}
function sanitizeWifi(){const w=S.wifi;if(w.band=='6'&&!C6.includes(w.cc))w.band='5';
 if(!MODES[w.band].includes(w.mode))w.mode=MODES[w.band][MODES[w.band].length-2];
 if(!BW[w.band].includes(+w.bw)||!bwOk(+w.bw,w.band,w.mode))w.bw=20;
 const chs=CH[w.band](w.cc);if(!chs.includes(+w.ch))w.ch=chs[Math.min(5,chs.length-1)];
 if(w.auto){w.ch=chs[Math.floor(chs.length/2)]}}
function leases(){const d=S.dhcp,res={};if(!d.on||!vIP(d.start)||!vIP(d.end))return res;let p=ip2n(d.start);const used=new Set(S.dev.filter(x=>x.sip).map(x=>x.sip));
 S.dev.forEach(x=>{if(x.sip)return;while(p<=ip2n(d.end)&&(used.has(n2ip(p))||n2ip(p)===S.lan.ip))p++;if(p<=ip2n(d.end)){res[x.mac]=n2ip(p);used.add(n2ip(p))}})
 return res}
function sim(){const w=S.wifi,wan=S.wan,l=S.lan,lease=leases(),r={};r.devs=S.dev.map(x=>{
 const o={d:x,ip:x.sip&&inNet(x.sip,l.ip,l.mask)?x.sip:lease[x.mac]||'',why:'',on:false,band:'',rssi:0};
 if(x.blocked)o.why='Bloqueado';
 else if(x.link=='wifi'){if(!w.on)o.why='Radio apagada';else if(!x.bands.includes(w.band))o.why='Banda '+w.band+' GHz no compatible';
  else if(S.sec.mode!='open'&&!S.sec.pass)o.why='Sin clave';else{o.band=w.band;o.rssi=rssiDev(x,w.band);if(o.rssi<-85)o.why='Señal insuficiente';}}
 if(!o.why&&!o.ip)o.why='Sin IP (DHCP desactivado o rango agotado)';
 o.on=!o.why;return o});
 const wc=r.devs.filter(o=>o.on&&o.d.link=='wifi').length;if(wc>w.max){let k=0;r.devs.forEach(o=>{if(o.on&&o.d.link=='wifi'&&++k>w.max){o.on=false;o.why='Límite de clientes'}})}
 r.wanUp=wan.up&&wan.mode!='off'&&(wan.mode!='static'||(vIP(wan.ip)&&vMask(wan.mask)&&vIP(wan.gw)))&&(wan.mode!='pppoe'||!!wan.user);
 r.inet=r.wanUp;
 const dem={Móvil:25,Tableta:40,Portátil:80,PC:60,TV:75,Impresora:2};let tot=0;
 const wt={high:4,normal:2,low:1};const on=r.devs.filter(o=>o.on);
 const cap=Math.min(wan.down,S.qos.down);on.forEach(o=>{o.dem=r.inet?Math.min(dem[o.d.t]||20,o.d.lim||999):0;tot+=o.dem});
 if(tot>cap){const useQ=S.qos.on;let rem=cap,act=on.filter(o=>o.dem>0);act.forEach(o=>o.got=0);
  while(rem>.01&&act.length){const sw=act.reduce((a,o)=>a+(useQ?wt[o.d.prio]:1),0);let used=0;act.forEach(o=>{const s=Math.min(rem*(useQ?wt[o.d.prio]:1)/sw,o.dem-o.got);o.got+=s;used+=s});rem-=used;act=act.filter(o=>o.got<o.dem-.01)}
  }else on.forEach(o=>o.got=o.dem);
 on.forEach(o=>o.got=o.got||0);r.down=on.reduce((a,o)=>a+o.got,0);r.cap=cap;r.pr=problems(r);
 r.state=r.pr.some(p=>p.l=='ER')?'ER':r.pr.length?'WA':'OK';return r}
function problems(r){const P=[],l=S.lan,d=S.dhcp,add=(l,m)=>P.push({l,m});
 if(!vIP(l.ip))add('ER','IP LAN no válida.');else if(!vMask(l.mask))add('ER','Máscara LAN no válida (debe ser contigua).');
 else{const n=net(l.ip,l.mask),b=bc(l.ip,l.mask);if(ip2n(l.ip)===n)add('ER','La IP LAN es la dirección de red; usa un host.');if(ip2n(l.ip)===b)add('ER','La IP LAN es la dirección de broadcast; usa un host.');
 if(d.on){if(!vIP(d.start)||!vIP(d.end))add('ER','Rango DHCP con IP no válida.');else{if(ip2n(d.start)>ip2n(d.end))add('ER','El inicio DHCP es mayor que el final.');
  if(!inNet(d.start,l.ip,l.mask)||!inNet(d.end,l.ip,l.mask))add('ER','El rango DHCP no pertenece a la subred LAN '+n2ip(n)+'/'+cidr(l.mask)+'.');
  else if(ip2n(d.start)<=n||ip2n(d.end)>=b)add('ER','El rango DHCP incluye la dirección de red o broadcast.');
  if(ip2n(l.ip)>=ip2n(d.start)&&ip2n(l.ip)<=ip2n(d.end))add('WA','La IP del router está dentro del rango DHCP; riesgo de conflicto.')}}
 if(S.wan.mode=='static'&&vIP(S.wan.ip)&&vMask(S.wan.mask)&&net(S.wan.ip,S.wan.mask)===n)add('ER','Conflicto: la subred WAN coincide con la LAN.');}
 if(S.adm.def)add('WA','Contraseña de administrador por defecto: cámbiala en Administración.');if(!S.adm.req)add('WA','El acceso de administración no pide contraseña.');
 if(!r.wanUp)add('WA','WAN desconectada: no hay Internet simulado.');
 const w=S.wifi;if(!w.on)add('WA','Radio Wi-Fi desactivada.');if(!/^.{1,32}$/.test(w.ssid))add('ER','SSID de 1 a 32 caracteres.');
 if(S.sec.mode=='open')add('WA','Red abierta: tráfico sin cifrar.');else if(S.sec.pass.length<Math.max(8,S.sec.minlen)||S.sec.pass.length>63)add('ER','La clave debe tener entre '+Math.max(8,S.sec.minlen)+' y 63 caracteres.');
 if(w.band=='2.4'&&S.sec.mode=='wpa3'&&w.mode=='b')add('ER','WPA3 no es compatible con 802.11b.');
 if(w.band=='2.4'&&w.bw==40)add('WA','40 MHz en 2,4 GHz provoca solapamientos con redes vecinas.');
 if(S.sec.wps)add('WA','WPS activo: es una vía de ataque conocida.');

 return P}
function routesAll(){const l=S.lan,R=[];if(vIP(l.ip)&&vMask(l.mask))R.push({dst:n2ip(net(l.ip,l.mask)),mask:l.mask,gw:'0.0.0.0',iface:'LAN',metric:0,type:'Conectada',auto:1});

function lookup(dst){let best=null;routesAll().forEach(r=>{if(!vIP(r.dst)||!vMask(r.mask)&&r.mask!='0.0.0.0')return;if(inNet(dst,r.dst,r.mask)){const c=r.mask=='0.0.0.0'?0:cidr(r.mask);

 <div class="c">${tbl(['Dispositivo','Prioridad','Límite (Mbps, 0 = sin límite)'],S.dev.map((d,i)=>[esc(d.n),`<select aria-label="Prioridad ${esc(d.n)}" onchange="S.dev[${i}].prio=this.value;save();render()">${['high','normal','low'].map(p=>`<option value="${p}" ${d.prio==p?'selected':''}>${{high:'Alta',normal:'Normal',low:'Baja'}[p]}</option>`).join('')}</select>`,`<input type="number" min="0" value="${d.lim}" aria-label="Límite ${esc(d.n)}" onchange="S.dev[${i}].lim=+this.value;save();render()" style="width:90px">`]))}</div>`}

 <div class="c"><div class="row"><button onclick="save();toast('Configuración guardada')">Guardar</button><button class="g" onclick="exp()">Exportar JSON</button><label class="g" style="font-weight:400;margin:0;border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer">Importar<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="g" onclick="reboot()">Reiniciar</button><button class="d" onclick="factory()">Valores de fábrica</button></div><p class="m">La exportación no incluye contraseñas.</p></div>${admPass()}</div>`}

function imp(f){const r=new FileReader();r.onload=()=>{try{const c=JSON.parse(r.result);
 if(c.v!==1||!c.wifi||!c.lan||!c.dhcp||!c.wan||!c.sec||!Array.isArray(c.dev)||!Array.isArray(c.routes)||!vIP(c.lan.ip)||!vMask(c.lan.mask)||!c.dev.every(d=>d.n&&d.mac&&Array.isArray(d.bands)))throw 0;
 const keep=S.sec.pass,ka=S.adm;S=Object.assign(DEF(),c);S.adm=ka;if(!S.cov||!Array.isArray(S.cov.obs)||typeof S.cov.pos!=='object'||!S.cov.pos)S.cov=DEF().cov;S.log=[];S.nat=c.nat||[];if(!S.sec.pass)S.sec.pass=keep;L('Sistema','INFO','Configuración importada');save();toast('Configuración importada');render()}catch(e){toast('Archivo rechazado: configuración no válida')}};r.readAsText(f.files[0])}

function diag(){const o=window._ping||'',lan=S.lan;return `<h2>Diagnóstico</h2><div class="grid"><div class="c"><h3>Ping / traceroute</h3><div class="row"><input id="pg" placeholder="IPv4 destino" value="${window._pt||''}" aria-label="IP destino"><button onclick="ping()">Ping</button><button class="g" onclick="trace()">Traceroute</button></div><pre id="po" style="white-space:pre-wrap">${o}</pre></div>
 <div class="c"><h3>Interfaces</h3>${tbl(['Interfaz','Estado','IP','Velocidad'],[['LAN','Activa',lan.ip,'1 Gbps'],['WAN',R.wanUp?'Activa':'Caída',R.wanUp?'203.0.113.25':'—',S.wan.down+' Mbps'],['Radio '+S.wifi.band+' GHz',S.wifi.on?'Activa (canal '+S.wifi.ch+')':'Apagada','—',theo()+' Mbps']])}</div>
 <div class="c"><h3>Escáner LAN (simulado)</h3>${tbl(['IP','MAC','Nombre'],R.devs.filter(x=>x.on).map(x=>[x.ip,x.d.mac,esc(x.d.n)]))}</div></div>`}
function reach(t){if(!vIP(t))return {e:'IP no válida'};const lanDev=R.devs.find(o=>o.ip===t);if(t===S.lan.ip)return{ok:1,rtt:1,h:['router']};
 if(inNet(t,S.lan.ip,S.lan.mask))return lanDev&&lanDev.on?{ok:1,rtt:lanDev.d.link=='wifi'?4:1,h:[S.lan.ip,t]}:{e:'Host de destino inalcanzable'};
 const b=lookup(t);if(!b)return{e:'Red de destino inalcanzable (sin ruta)'};if(b.r.iface=='WAN'&&!R.inet)return{e:'Sin conectividad WAN'};return{ok:1,rtt:18,h:[S.lan.ip,S.wan.gw,'198.51.100.1',t]}}
function ping(){const t=pg.value.trim();window._pt=t;const r=reach(t);let o='PING '+t+'\n';
 if(r.e)o+='Enviados 4, recibidos 0, perdidos 4 (100 %)\n'+r.e;else{const v=[0,1,2,3].map(()=>r.rtt+Math.random()*r.rtt*.4);o+=v.map((x,i)=>`${i+1}: ${x.toFixed(1)} ms`).join('\n')+`\nEnviados 4, recibidos 4, perdidos 0\nmín ${Math.min(...v).toFixed(1)} / media ${(v.reduce((a,b)=>a+b)/4).toFixed(1)} / máx ${Math.max(...v).toFixed(1)} ms`}
 window._ping=o;L('Diagnóstico',r.e?'WARN':'INFO','Ping a '+t);render()}
function trace(){const t=pg.value.trim();window._pt=t;const r=reach(t);window._ping='Traceroute a '+t+'\n'+(r.e?r.e:r.h.map((h,i)=>(i+1)+'  '+h+'  '+((i+1)*r.rtt/r.h.length).toFixed(1)+' ms').join('\n'));render()}

/* ---- Ayuda ---- */
function ayuda(){const T=[
['1. Qué es un router inalámbrico','Equipo que conecta tu red local (LAN) con otra red, normalmente Internet (WAN), y además ofrece Wi-Fi, DHCP, NAT y cortafuegos básico.','Ejemplo: tu router de casa une el móvil, el portátil y la fibra del operador.','panel'],
['2. Router, switch y punto de acceso','Router: decide por dirección IP entre redes. Switch: reenvía tramas por dirección MAC dentro de una misma red. Punto de acceso: convierte la red cableada en Wi-Fi. Un router doméstico integra los tres.','Ejemplo: PC-AULA-01 va por cable (switch); MOVIL-01 por Wi-Fi (punto de acceso).','panel'],
['3. Funcionamiento de las redes Wi-Fi','Los equipos comparten un medio por radio y esperan turno (CSMA/CA) para no transmitir a la vez. Cuantos más clientes y más redes vecinas en el mismo canal, más esperas y menos velocidad real.','Ejemplo: con 32 clientes en un canal saturado, cada uno obtiene una fracción del caudal.','wifi'],
['4. Bandas de 2,4, 5 y 6 GHz','2,4 GHz: más alcance y mejor atraviesa paredes, pero pocos canales y mucha interferencia. 5 GHz: más velocidad y más canales, menos alcance. 6 GHz: canales libres de equipos antiguos (Wi-Fi 6E/7), alcance aún menor y no disponible en todos los países.','Ejemplo: en Configuración Wi-Fi pasa a 5 GHz y verás que IMPRESORA-WIFI (solo 2,4 GHz) se desconecta.','wifi'],
['5. Estándares IEEE 802.11','b (11 Mbps), g (54), n/Wi-Fi 4, ac/Wi-Fi 5 (solo 5 GHz), ax/Wi-Fi 6 y 6E, be/Wi-Fi 7. Cada estándar admite ciertas bandas y anchos de canal; los equipos antiguos obligan a usar modos de compatibilidad.','Ejemplo: 802.11ac no aparece en 2,4 GHz porque no existe en esa banda.','wifi'],
['6. SSID y BSSID','El SSID es el nombre visible de la red. El BSSID es la MAC de la radio del punto de acceso e identifica de forma única cada emisor. Ocultar el SSID no es una medida de seguridad real: los equipos siguen emitiéndolo al conectarse.','Ejemplo: cambia el SSID y comprueba el registro de eventos.','wifi'],
['7. Canales y ancho de canal','En 2,4 GHz los canales están separados 5 MHz pero ocupan 20 MHz, así que solo 1, 6 y 11 no se solapan. Un ancho mayor (40, 80, 160, 320 MHz) multiplica la velocidad máxima, pero consume más espectro y capta más ruido. Elige el canal menos usado por las redes vecinas.','Ejemplo: prueba 40 MHz en 2,4 GHz y observa el aviso de solapamiento.','wifi'],
['8. Potencia de transmisión y dBm','dBm = 10·log10(mW). 100 mW son 20 dBm; cada 3 dB la potencia se duplica. Más potencia amplía la cobertura del router, pero el móvil no puede responder con la misma potencia, así que no siempre mejora la conexión.','Ejemplo: baja la potencia al 10 % y mira cómo cae la señal de cada dispositivo.','wifi'],
['9. Dirección IP y máscara de subred','La IP identifica un equipo y la máscara indica qué parte es de red y cuál de host. /24 (255.255.255.0) deja 254 hosts. Dos equipos solo se hablan directamente si están en la misma subred.','Ejemplo: usa la calculadora de LAN con 192.168.1.1/24 y luego con /26.','lan'],
['10. DHCP','Servicio que entrega IP, máscara, puerta de enlace y DNS a los clientes por un tiempo (concesión). El rango debe estar dentro de la subred y no incluir la IP de red, la de broadcast ni la del router.','Ejemplo: apaga DHCP y verás que los equipos sin IP estática pierden la conexión.','dhcp'],
['11. DNS','Traduce nombres (como www.ejemplo.es) a direcciones IP. Si el DNS falla, puedes hacer ping a una IP pero no navegar por nombre.','Ejemplo: revisa los DNS en LAN y en WAN.','lan'],
['12. Puerta de enlace','Es la dirección del router dentro de la LAN: a ella envían los equipos todo lo que no es de su subred. Si es incorrecta, funciona la red local pero no Internet.','Ejemplo: la puerta de enlace DHCP debe coincidir con la IP LAN.','dhcp'],
['13. WAN y LAN','LAN: red interna con direcciones privadas. WAN: lado del proveedor, con IP pública. Las subredes de ambos lados no pueden solaparse.','Ejemplo: en WAN estática usa la misma red que la LAN y verás el conflicto.','wan'],
['14. NAT','El router sustituye la IP privada del cliente por su IP pública y recuerda la traducción por puerto. Desde fuera no se alcanza un equipo interno salvo que exista una redirección de puertos.','Ejemplo: crea una regla HTTPS 443 hacia un equipo interno.','nat'],
['15. Enrutamiento','Cada paquete se envía por la ruta cuyo prefijo coincide con más bits (prefijo más largo); si empatan, gana la métrica menor. La ruta 0.0.0.0/0 es la predeterminada.','Ejemplo: borra la ruta predeterminada y haz ping a 8.8.8.8.','rutas'],
['16. WPA2 y WPA3','WPA2-Personal usa clave compartida y cifrado AES-CCMP; una clave débil se puede adivinar capturando el saludo inicial. WPA3 usa SAE, que impide ese ataque offline y protege mejor. Enterprise autentica a cada usuario con un servidor RADIUS.','Ejemplo: prueba WPA3 y fíjate en la compatibilidad con equipos antiguos (modo transición).','seg'],
['17. QoS','Cuando el enlace se satura, la calidad de servicio reparte el caudal según prioridades: las videollamadas y los juegos toleran mal el retardo; las descargas, sí.','Ejemplo: baja el ancho de banda total y pon SMART-TV en prioridad baja.','qos'],
['18. Interferencias y cobertura','La señal cae con la distancia y la frecuencia, y las paredes de hormigón o metal la atenúan mucho. Los hornos microondas, el Bluetooth y los vecinos interfieren en 2,4 GHz.','Ejemplo: compara la señal de un mismo equipo en 2,4 y 5 GHz.','cob'],
['19. Seguridad de las redes inalámbricas','Usa WPA2/WPA3, claves largas, desactiva WPS, cambia la contraseña de administración, aísla la red de invitados y mantén el firmware actualizado. Una red abierta permite espiar el tráfico no cifrado.','Ejemplo: activa WPS o una clave corta y lee las advertencias.','seg'],
['20. Diagnóstico de problemas habituales','Procedimiento: 1) ¿tiene IP el cliente? 2) ¿responde el router? 3) ¿responde una IP de Internet? 4) ¿resuelve nombres? Cada respuesta negativa señala dónde mirar: Wi-Fi, DHCP, WAN, rutas o DNS.','Ejemplo: desconecta la WAN y haz ping a 8.8.8.8, luego a 192.168.1.1.','diag']];
const E=[['Configurar una red doméstica','Pon un SSID propio, WPA2 con clave fuerte y revisa que el panel quede en OPERATIVO.','wifi'],['Crear una red de invitados','Actívala con SSID y clave propios, aislamiento y bloqueo de acceso a la LAN.','wifi'],['Cambiar el canal Wi-Fi','Elige 1, 6 u 11 en 2,4 GHz y explica por qué.','wifi'],['Crear un rango DHCP','Define 192.168.1.50 a 192.168.1.80 y comprueba las IP de los clientes.','dhcp'],['Resolver un conflicto de subredes','En WAN estática usa 192.168.1.50/24 y corrígelo cambiando la LAN a 10.0.0.1/24.','wan'],['Configurar una ruta estática','Añade 10.1.0.0/255.255.0.0 por 192.168.1.2 y pruébala en la herramienta de rutas.','rutas'],['Mejorar la cobertura','Sube la potencia, mueve el router y cambia de banda para ver qué dispositivos mejoran y cuáles no.','cob']];
return `<h2>Ayuda y teoría</h2><p class="m">Cada apartado se relaciona con los controles del simulador. Pulsa «Ir a la sección» para probarlo.</p>${T.map(t=>`<details class="c"><summary><b>${t[0]}</b></summary><p>${t[1]}</p><p class="m">${t[2]}</p><button class="g" onclick="go('${t[3]}')">Ir a la sección</button></details>`).join('')}<div class="c"><h3>Ejercicios</h3>${E.map((e,i)=>`<p><b>${i+1}. ${e[0]}.</b> ${e[1]} <button class="g" onclick="go('${e[2]}')">Ir</button></p>`).join('')}</div>`}

 document.querySelector('.wrap').inert=need;document.querySelector('header').inert=need;
 if(need){document.getElementById('lh').textContent=S.adm.def?'Contraseña inicial: admin':'';document.getElementById('lm').textContent='';setTimeout(()=>document.getElementById('lp').focus(),50)}}
function doLogin(){const lp=document.getElementById('lp'),lm=document.getElementById('lm');
 if(Date.now()<S.adm.lock){lm.textContent='Demasiados intentos. Espera '+Math.ceil((S.adm.lock-Date.now())/1000)+' s.';return}
 if(h53(lp.value)===S.adm.h){AUTH=true;try{sessionStorage.setItem('wrl_auth','1')}catch(e){}S.adm.fails=0;lp.value='';L('Acceso','INFO','Inicio de sesión de administrador');save();showLogin();render()}
 else{S.adm.fails++;L('Acceso','WARN','Intento de acceso fallido');lp.value='';if(S.adm.fails>=5){S.adm.lock=Date.now()+30000;S.adm.fails=0;lm.textContent='Demasiados intentos. Acceso bloqueado 30 s.'}else lm.textContent='Contraseña incorrecta ('+S.adm.fails+'/5).';save()}}

 <label for="ap0">Contraseña actual</label><input id="ap0" type="password" autocomplete="current-password"><label for="ap1">Nueva contraseña (mínimo 8)</label><input id="ap1" type="password" autocomplete="new-password"><label for="ap2">Repetir nueva contraseña</label><input id="ap2" type="password" autocomplete="new-password">
 <p><button onclick="changePass()">Cambiar contraseña</button></p><label><input type="checkbox" ${S.adm.req?'checked':''} onchange="S.adm.req=this.checked;L('Seguridad','WARN','Contraseña al abrir '+(this.checked?'activada':'desactivada'));save();render()"> Pedir contraseña al abrir el panel</label>

/* ===== Cobertura Wi-Fi ===== */
const MAT={Tabique:3,Cristal:2,Ladrillo:7,'Hormigón':12,Metal:20},MC={Tabique:'#b9a37a',Cristal:'#7fc6e0',Ladrillo:'#b5654a',Hormigón:'#7d8594',Metal:'#38404f'};
const DPOS=[[250,420],[330,120],[560,150],[620,380],[720,440],[690,250]];
function posOf(i){return S.cov.pos[S.dev[i].mac]||DPOS[i%6]}
function segRect(x1,y1,x2,y2,r){let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
 for(const [p,q] of [[-dx,x1-r.x],[dx,r.x+r.w-x1],[-dy,y1-r.y],[dy,r.y+r.h-y1]]){if(p===0){if(q<0)return false}else{const t=q/p;if(p<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}}return true}
function covLoss(x,y,band){const[rx,ry]=S.cov.router,d=Math.max(1,Math.hypot(x-rx,y-ry)*.02),f={'2.4':2437,'5':5500,'6':6500}[band]||2437;let a=0,n=0;
 S.cov.obs.forEach(o=>{if(segRect(rx,ry,x,y,o)){a+=o.db;n++}});return{d,a,n,pl:20*Math.log10(f)-27.55+30*Math.log10(d)+a}}
function rssiXY(x,y,band){const w=S.wifi;return Math.round(10*Math.log10(Math.max(.01,w.pmax*w.pow/100))-covLoss(x,y,band).pl)}
function rssiDev(d,band){const p=posOf(S.dev.indexOf(d));return rssiXY(p[0],p[1],band)}
function qual(r){return r>-55?['Excelente','#13795b']:r>-65?['Buena','#5aa02c']:r>-75?['Aceptable','#c99700']:r>-85?['Débil','#e0701a']:['Sin conexión','#b3261e']}
const heat=r=>r>-55?'rgba(19,121,91,.5)':r>-65?'rgba(90,160,44,.45)':r>-75?'rgba(217,164,0,.45)':r>-85?'rgba(224,112,26,.45)':'rgba(120,130,150,.22)';
function cob(){const c=S.cov,w=S.wifi,so=window._so,o=c.obs[so],bands=['2.4','5'].concat(C6.includes(w.cc)?['6']:[]);
 const rows=S.dev.map((d,i)=>{const p=posOf(i),l=covLoss(p[0],p[1],w.band),r=rssiXY(p[0],p[1],w.band),q=qual(r),wf=d.link=='wifi';return[esc(d.n),wf?'Wi-Fi':'Cable',l.d.toFixed(1)+' m',l.n,l.a+' dB',wf&&w.on?r+' dBm':'—',wf&&w.on?`<b style="color:${q[1]}">${q[0]}</b>`:'—']});
 const mo=k=>Object.keys(MAT).map(m=>`<option ${m==k?'selected':''}>${m}</option>`).join('');
 return `<h2>Cobertura Wi-Fi</h2><div class="c"><canvas id="cvp" width="800" height="500" style="height:auto;aspect-ratio:8/5;touch-action:none;cursor:grab" role="img" aria-label="Plano de cobertura con router, dispositivos y obstáculos"></canvas>
 <p class="m">Arrastra el router, los dispositivos y los obstáculos. Pulsa un obstáculo para editarlo. Escala: 50 px = 1 m.</p>
 <div class="row">${[['Excelente','#13795b'],['Buena','#5aa02c'],['Aceptable','#c99700'],['Débil','#e0701a'],['Sin conexión','#78828f']].map(x=>`<span><b style="color:${x[1]}">■</b> ${x[0]}</span>`).join('')}</div></div>
 <div class="grid"><div class="c">${w.on?'':'<p class="WA">La radio está apagada: no hay cobertura.</p>'}${inp('wifi.pow','Potencia de transmisión (%)',{type:'range',min:1,max:100,n:1})}<p>${w.pow} % ≈ ${(10*Math.log10(Math.max(.01,w.pmax*w.pow/100))).toFixed(1)} dBm</p>${inp('wifi.band','Banda (GHz)',{opts:bands})}
 <h3>Obstáculos (${c.obs.length})</h3><div class="row"><select id="om" aria-label="Material">${mo('Tabique')}</select><button onclick="addObs()">Añadir</button></div>
 ${o?`<h3>Obstáculo seleccionado</h3><label for="os">Material</label><select id="os" onchange="selMat(this.value)">${mo(o.m)}</select><label for="od">Atenuación (dB)</label><input id="od" type="number" min="0" max="60" value="${o.db}" onchange="setObs('db',this.value)"><label for="ow">Ancho (px)</label><input id="ow" type="number" min="4" max="500" value="${o.w}" onchange="setObs('w',this.value)"><label for="oh">Alto (px)</label><input id="oh" type="number" min="4" max="500" value="${o.h}" onchange="setObs('h',this.value)"><p><button class="d" onclick="delObs()">Eliminar</button></p>`:'<p class="m">Ningún obstáculo seleccionado.</p>'}</div>
 <div class="c"><h3>Señal estimada</h3>${tbl(['Dispositivo','Tipo','Distancia','Obstáculos','Atenuación','Señal','Calidad'],rows)}</div></div>
 <div class="c"><h3>Limitaciones del modelo</h3><p class="m">Se usa pérdida en espacio libre a 1 m más 30·log10(distancia) para interior, y se suma la atenuación de cada obstáculo cruzado por la línea recta router-dispositivo. No considera antenas, reflexiones, multitrayecto, interferencias ni la altura. La cobertura real puede diferir bastante.</p></div>`}
function addObs(){const m=document.getElementById('om').value;S.cov.obs.push({x:300,y:200,w:100,h:10,db:MAT[m],m});window._so=S.cov.obs.length-1;L('Cobertura','INFO','Obstáculo añadido: '+m);save();render()}
function selMat(m){const o=S.cov.obs[window._so];if(!o)return;o.m=m;o.db=MAT[m];save();render()}
function setObs(k,v){const o=S.cov.obs[window._so];if(!o)return;v=+v;if(!isFinite(v))return;o[k]=k=='db'?Math.min(60,Math.max(0,v)):Math.min(500,Math.max(4,v));save();render()}
function delObs(){S.cov.obs.splice(window._so,1);window._so=null;L('Cobertura','INFO','Obstáculo eliminado');save();render()}
function drawCov(g){const w=S.wifi,W=800,Hh=500;g.clearRect(0,0,W,Hh);g.fillStyle=S.dark?'#0f182d':'#f7f9fd';g.fillRect(0,0,W,Hh);
 if(w.on)for(let x=0;x<W;x+=20)for(let y=0;y<Hh;y+=20){g.fillStyle=heat(rssiXY(x+10,y+10,w.band));g.fillRect(x,y,20,20)}
 S.cov.obs.forEach((o,i)=>{g.fillStyle=MC[o.m]||'#555';g.fillRect(o.x,o.y,o.w,o.h);if(i===window._so){g.strokeStyle='#1f5fd6';g.lineWidth=3;g.strokeRect(o.x-2,o.y-2,o.w+4,o.h+4)}});
 const[rx,ry]=S.cov.router;S.dev.forEach((d,i)=>{const p=posOf(i),r=rssiXY(p[0],p[1],w.band),wf=d.link=='wifi';
  if(wf&&w.on){g.strokeStyle=qual(r)[1];g.setLineDash([5,5]);g.lineWidth=1.5;g.beginPath();g.moveTo(rx,ry);g.lineTo(p[0],p[1]);g.stroke();g.setLineDash([])}
  g.fillStyle=wf?'#14213a':'#4a5568';g.beginPath();g.arc(p[0],p[1],11,0,7);g.fill();g.fillStyle=S.dark?'#e8eefb':'#14213a';g.font='12px sans-serif';g.textAlign='center';g.fillText(d.n.slice(0,12),p[0],p[1]+27);if(wf&&w.on)g.fillText(r+' dBm',p[0],p[1]+40)});
 g.fillStyle='#1f5fd6';g.beginPath();g.arc(rx,ry,15,0,7);g.fill();g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='center';g.fillText('R',rx,ry+4);
 g.fillStyle=S.dark?'#e8eefb':'#14213a';g.fillRect(20,478,250,3);g.fillText('5 m',145,472)}
function initCov(){const cv=document.getElementById('cvp');if(!cv)return;const g=cv.getContext('2d');let dr=null;drawCov(g);
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*500/r.height]};
 const hit=(x,y)=>{const[rx,ry]=S.cov.router;if(Math.hypot(x-rx,y-ry)<20)return{k:'r'};for(let i=S.dev.length-1;i>=0;i--){const p=posOf(i);if(Math.hypot(x-p[0],y-p[1])<16)return{k:'d',i}}
  for(let i=S.cov.obs.length-1;i>=0;i--){const o=S.cov.obs[i];if(x>=o.x-4&&x<=o.x+o.w+4&&y>=o.y-4&&y<=o.y+o.h+4)return{k:'o',i}}return null};
 cv.onpointerdown=e=>{const[x,y]=pt(e),h=hit(x,y);if(!h)return;cv.setPointerCapture(e.pointerId);const b=h.k=='r'?S.cov.router:h.k=='d'?posOf(h.i):[S.cov.obs[h.i].x,S.cov.obs[h.i].y];dr={h,ox:x-b[0],oy:y-b[1],moved:false};if(h.k=='o'){window._so=h.i}};
 cv.onpointermove=e=>{if(!dr)return;const[x,y]=pt(e);dr.moved=true;const nx=Math.min(790,Math.max(10,x-dr.ox)),ny=Math.min(490,Math.max(10,y-dr.oy));
  if(dr.h.k=='r')S.cov.router=[nx,ny];else if(dr.h.k=='d')S.cov.pos[S.dev[dr.h.i].mac]=[nx,ny];else{const o=S.cov.obs[dr.h.i];o.x=Math.min(800-o.w,Math.max(0,x-dr.ox));o.y=Math.min(500-o.h,Math.max(0,y-dr.oy))}
  requestAnimationFrame(()=>drawCov(g))};
 cv.onpointerup=()=>{if(!dr)return;dr=null;save();render()}}
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()});
document.getElementById('md').addEventListener('click',e=>{if(e.target.id=='md')closeM()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
if(!S.log.length)L('Sistema','INFO','Inicio del router');
sanitizeWifi();save();showLogin();render();
</script></body></html>
