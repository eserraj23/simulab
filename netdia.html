<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<title>NetArchitect Pro</title>
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}

header{grid-area:t;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}

button{cursor:pointer}button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.sep{width:1px;height:20px;background:var(--bd)}

main{grid-area:m;position:relative;min-width:0;min-height:0}
#sv{width:100%;height:100%;display:block;background:var(--cv);touch-action:none}
#pr{grid-area:p;background:var(--pn);border-left:1px solid var(--bd);overflow:auto;padding:10px}
#pr label{display:block;margin:6px 0 0;color:var(--mt);font-size:11px}#pr input:not([type=checkbox]),#pr select,#pr textarea{width:100%}
#pr table{width:100%;border-collapse:collapse;font-size:11px}#pr td{padding:2px}#pr td input,#pr td select{padding:2px 3px;width:100%}

#cm{position:fixed;display:none;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:4px;z-index:9;box-shadow:0 6px 20px #0003}
#cm div{padding:5px 12px;cursor:pointer;border-radius:5px}#cm div:hover{background:var(--bg)}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:10px;min-width:300px;max-width:92vw}
dialog::backdrop{background:#0006}dialog select,dialog input{width:100%;margin:2px 0 8px}
#ts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:6px 14px;border-radius:8px;display:none;z-index:10}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--bg);margin:2px 0}
@media(max-width:820px){body{grid-template:auto auto 1fr 40vh auto/1fr;grid-template-areas:"t" "c" "m" "p" "s"}
#cat{display:flex;gap:4px;overflow-x:auto;padding:4px;border-right:0;border-bottom:1px solid var(--bd)}#cat h4,.lg{display:none}.it{flex:none;flex-direction:column;gap:0;font-size:10px}#pr{border-left:0;border-top:1px solid var(--bd)}}
</style></head><body>

</header>

M27 20h.1"/>',iot:'<rect x="11" y="11" width="18" height="18" rx="2"/><path d="M16 6v5M24 6v5M16 29v5M24 29v5M6 16h5M6 24h5M29 16h5M29 24h5"/><circle cx="20" cy="20" r="3"/>',rack1u:'<rect x="3" y="13" width="34" height="14" rx="2"/><path d="M12 16v8M17 16v8M22 16v8M27 16v8M7 17h.1M7 23h.1M33 17h.1M33 23h.1"/>',rack2u:'<rect x="3" y="8" width="34" height="24" rx="2"/><path d="M9 13h6v6H9zM17 13h6v6h-6zM25 13h6v6h-6zM9 22h6v6H9zM17 22h6v6h-6zM25 22h6v6h-6z"/>',smartphone:'<rect x="12" y="4" width="16" height="32" rx="3"/><path d="M18 8h4M20 32h.1"/>',tablet:'<rect x="6" y="7" width="28" height="26" rx="3"/><path d="M31 20h.1M12 12h12"/>',roseta:'<rect x="6" y="6" width="28" height="28" rx="4"/><path d="M13 14h14v11h-4v3h-6v-3h-4zM17 18v4M20 18v4M23 18v4M10 9.5h.1M30 9.5h.1"/>',ups:'<rect x="4" y="11" width="30" height="18" rx="3"/><path d="M34 17h3v6h-3M21 14l-6 7h4l-1 6 7-8h-4z"/>',cloud:'<path d="M11 31C4 31 3 21 11 20 11 11 25 9 28 17 36 17 37 31 29 31z"/>',internet:'<circle cx="20" cy="20" r="15"/><ellipse cx="20" cy="20" rx="6" ry="15"/><path d="M5 20h30M8 12h24M8 28h24"/>',vpn:'<rect x="8" y="18" width="24" height="16" rx="3"/><path d="M13 18v-5a7 7 0 0 1 14 0v5M20 25v3"/>'};

const LT={cat5e:['Ethernet Cat 5e','#8a94a6','',2],cat6:['Ethernet Cat 6','#2563eb','',2.5],cat6a:['Ethernet Cat 6A','#0891b2','',2.5],cat7:['Ethernet Cat 7','#7c3aed','',2.5],cat8:['Ethernet Cat 8','#c026d3','',3],fsm:['Fibra monomodo','#d4a106','',3],fmm:['Fibra multimodo','#f97316','',3],dac:['DAC','#db2777','',3],aoc:['AOC','#e11d48','',3],coax:['Coaxial','#475569','',3],wifi:['WiFi','#16a34a','6 5',2],radio:['Radioenlace','#0d9488','2 5',3],wan:['Enlace WAN','#dc2626','10 4',3],vpn:['VPN','#6366f1','8 3 2 3',2.5]};
const ESC=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=load()||{d:[],l:[],n:1},sel=new Set(),selL=null,tool='sel',pend=null,view={x:300,y:200,z:1},drag=null,hl=new Set(),hist=[],hi=-1,clip=null;
function clean(j){j.d=j.d.filter(d=>T[d.type]);const ids=new Set(j.d.map(d=>d.id));j.l=j.l.filter(l=>ids.has(l.a)&&ids.has(l.b));return j}
function load(){try{return clean(JSON.parse(localStorage.getItem('nap1')))}catch(e){return null}}
function save(){try{localStorage.setItem('nap1',JSON.stringify(S));$('#sa').textContent='Guardado automáticamente '+new Date().toLocaleTimeString()}catch(e){$('#sa').textContent='Sin almacenamiento local: exporta JSON'}}
function commit(){const s=JSON.stringify(S);if(hist[hi]!==s){hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80)hist.shift();hi=hist.length-1}save();draw();panel()}
function hgo(k){const j=hi+k;if(j<0||j>=hist.length)return;hi=j;S=JSON.parse(hist[j]);sel.clear();selL=null;save();draw();panel()}
const dev=id=>S.d.find(d=>d.id===id),lnk=id=>S.l.find(l=>l.id===id);
const mac=()=>[...Array(6)].map(()=>Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join(':').replace(/^../,'02');
function mk(type,x,y){const t=T[type],n=S.d.filter(d=>d.type===type).length+1;
const ports=[...Array(t[2])].map((_,i)=>({n:t[3]+(t[3].endsWith('/')?i+1:i),ip:'',vlan:1,mode:'access',speed:'1 Gbps',poe:false,adm:'up',desc:''}));
const d={id:S.n++,type,x,y,name:t[0]+' '+n,host:'',vendor:'',model:'',serial:'',loc:'',rack:'',ip:'',ip6:'',mask:'',gw:'',mac:['cloud','internet','vpn'].includes(type)?'':mac(),vlan:'',dns1:'',dhcp:false,notes:'',ports};S.d.push(d);return d}
const used=(id,p)=>S.l.some(l=>(l.a===id&&l.ap===p)||(l.b===id&&l.bp===p));
const freeP=d=>d.ports.find(p=>!used(d.id,p.n));

function node(c,dk,st,sw,da,t){if(!S.s3d)return`<rect width="${W}" height="${H}" rx="10" fill="${c.n}" stroke="${st}" stroke-width="${sw}" ${da}/><g transform="translate(23 2) scale(1.1)">${IC(t)}</g>`;
const a=`stroke="${st}" stroke-width="${sw}" stroke-linejoin="round" ${da}`,tp=dk?'#2d3d5a':'#f1f5fb',sd=dk?'#121b2b':'#c3cddf';
return`<rect x="6" y="20" width="96" height="52" rx="8" fill="#000" opacity=".13"/><polygon points="0,12 12,0 96,0 84,12" fill="${tp}" ${a}/><polygon points="84,12 96,0 96,52 84,64" fill="${sd}" ${a}/><rect y="12" width="84" height="52" fill="${c.n}" ${a}/><g transform="translate(22 17) scale(.95)">${IC(t)}</g>`}
function content(ex){const dk=!ex&&document.documentElement.dataset.theme==='dark',c=dk?{n:'#1f2a3d',s:'#4a5b78',t:'#e4e9f3',m:'#93a0b8'}:{n:'#fff',s:'#8c98ad',t:'#18202e',m:'#667085'};let h='';

function draw(){$('#sv').innerHTML=`<defs><pattern id="gp" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--gr)"/></pattern></defs><g transform="translate(${view.x} ${view.y}) scale(${view.z})"><rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#gp)"/>${content(false)}</g>`;
$('#b3d').classList.toggle('on',!!S.s3d);$('#sz').textContent='Zoom '+Math.round(view.z*100)+'%';$('#ss').textContent=`${S.d.length} dispositivos · ${S.l.length} conexiones · cuadrícula 20 px`;$('#bu').disabled=hi<1;$('#br').disabled=hi>=hist.length-1}
function wp(e){const r=$('#sv').getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.z,y:(e.clientY-r.top-view.y)/view.z}}

const sv=$('#sv');

else{if(!e.shiftKey){sel.clear();selL=null}pend=null;drag={m:'p',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y}}

sv.onpointermove=e=>{const p=wp(e);$('#sc').textContent=`x ${Math.round(p.x)}  y ${Math.round(p.y)}`;if(!drag)return;
if(drag.m==='p'){view.x=drag.vx+e.clientX-drag.sx;view.y=drag.vy+e.clientY-drag.sy}
